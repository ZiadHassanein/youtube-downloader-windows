<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Enable Vydrop's browser connection from Settings</title>
  <desc id="desc">Connection illustration. Open Settings at the bottom left of Vydrop, choose Browser integration, then Enable connection. The app confirms Browser connection enabled.</desc>
  <rect width="1200" height="430" rx="20" fill="#F8F7F8"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect width="1200" height="110" rx="20" fill="#181B20"/><rect y="85" width="1200" height="25" fill="#181B20"/>
    <circle cx="60" cy="55" r="24" fill="#E63D4D"/><text x="60" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">2</text>
    <text x="105" y="51" font-size="31" font-weight="600" fill="#F6F2F4">Connect the desktop app</text>
    <text x="105" y="82" font-size="18" fill="#D4BEC5">CONNECTION ILLUSTRATION · Vydrop 4.2.0</text>
    <g fill="#FFFFFF" stroke="#D7CAD2"><rect x="40" y="150" width="330" height="146" rx="12"/><rect x="435" y="150" width="330" height="146" rx="12"/><rect x="830" y="150" width="330" height="146" rx="12"/></g>
    <text x="64" y="201" font-size="27" font-weight="600" fill="#272329">Settings</text>
    <text x="64" y="253" font-size="20" fill="#655963">Bottom left of the app</text>
    <text x="459" y="201" font-size="26" font-weight="600" fill="#272329">Browser integration</text>
    <text x="459" y="253" font-size="20" fill="#655963">Open its connection dialog</text>
    <rect x="850" y="170" width="290" height="62" rx="9" fill="#BA263A"/>
    <text x="995" y="210" text-anchor="middle" font-size="25" font-weight="600" fill="#FFFFFF">Enable connection</text>
    <text x="854" y="267" font-size="19" fill="#655963">Registers this app's location</text>
    <path d="M386 223H418M408 213L418 223L408 233 M781 223H813M803 213L813 223L803 233" fill="none" stroke="#A91F33" stroke-width="3"/>
    <text x="42" y="358" font-size="23" font-weight="600" fill="#272329">Wait for: Browser connection enabled.</text>
    <text x="42" y="394" font-size="20" fill="#655963">Then close the dialog and load the companion in your browser.</text>
  </g>
</svg>
