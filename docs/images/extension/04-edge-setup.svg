<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Microsoft Edge extension setup</title><desc id="desc">Illustration: open edge://extensions, enable Developer mode, choose Load unpacked, select Browser/chromium, allow the desired sites and refresh the video page.</desc><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#F8F7F8" stroke="#DFD7DC"/><text x="40" y="52" font-size="30" fill="#272329" font-weight="600" text-anchor="start">Install Vydrop in Microsoft Edge</text><text x="40" y="86" font-size="18" fill="#655963" font-weight="400" text-anchor="start">Setup illustration · browser layout may vary</text><rect x="40" y="118" width="1120" height="58" rx="10" fill="#FFFFFF" stroke="#DFD7DC"/><text x="64" y="155" font-size="25" fill="#272329" font-weight="400" text-anchor="start">edge://extensions</text><rect x="40" y="198" width="240" height="280" rx="10" fill="#F1EDF0" stroke="#DFD7DC"/><text x="62" y="239" font-size="24" fill="#272329" font-weight="600" text-anchor="start">Extensions</text><text x="62" y="289" font-size="21" fill="#272329" font-weight="400" text-anchor="start">My extensions</text><circle cx="70" cy="371" r="17" fill="#BA263A"/><text x="70" y="377" font-size="19" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="96" y="378" font-size="18" fill="#272329" font-weight="400" text-anchor="start">Developer mode</text><rect x="214" y="357" width="46" height="26" rx="13" fill="#BA263A" stroke="#BA263A"/><circle cx="246" cy="370" r="9" fill="#FFFFFF"/><circle cx="323" cy="280" r="17" fill="#BA263A"/><text x="323" y="286" font-size="19" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><rect x="352" y="254" width="205" height="53" rx="10" fill="#FFFFFF" stroke="#8E7D87"/><text x="373" y="288" font-size="22" fill="#272329" font-weight="600" text-anchor="start">Load unpacked</text><rect x="306" y="337" width="814" height="126" rx="10" fill="#FFFFFF" stroke="#DFD7DC"/><svg x="324" y="360" width="46" height="46" viewBox="0 0 64 64"><path fill="#E63D4D" fill-rule="evenodd" d="M4,8.016L21.625,8.016 27.873,18.056 27.873,27.426 21.179,27.426 32,39.474 42.821,27.426 36.127,27.426 36.127,18.056 42.375,8.016 60,8.016 60,11.586 32,55.984 4,11.586Z"/><path fill="none" stroke="#FFFFFF" stroke-width="1.004" stroke-linejoin="miter" stroke-miterlimit="2" d="M27.873,18.056L27.873,27.426 21.179,27.426 32,39.474 42.821,27.426 36.127,27.426 36.127,18.056"/></svg><text x="384" y="382" font-size="25" fill="#272329" font-weight="600" text-anchor="start">Vydrop</text><text x="384" y="418" font-size="19" fill="#655963" font-weight="400" text-anchor="start">Enabled · Details · Reload</text><circle cx="64" cy="526" r="17" fill="#BA263A"/><text x="64" y="532" font-size="19" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><text x="92" y="533" font-size="23" fill="#272329" font-weight="600" text-anchor="start">Select this extracted folder:</text><rect x="62" y="553" width="1076" height="57" rx="10" fill="#F8E3E9" stroke="#DFD7DC"/><text x="84" y="590" font-size="25" fill="#272329" font-weight="400" text-anchor="start">Documents / Vydrop / Browser / chromium</text><circle cx="64" cy="657" r="17" fill="#BA263A"/><text x="64" y="663" font-size="19" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><text x="92" y="664" font-size="22" fill="#272329" font-weight="400" text-anchor="start">Details → Site access → On all sites; refresh your video page.</text><text x="62" y="715" font-size="20" fill="#655963" font-weight="400" text-anchor="start">Keep the folder in place. Chrome and Edge use the same chromium companion.</text></g></svg>
