<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Firefox temporary extension setup</title><desc id="desc">Illustration of This Firefox, Load Temporary Add-on and Browser/firefox/manifest.json. This unsigned local companion must be loaded again after a Firefox restart.</desc><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#F8F7F8" stroke="#DFD7DC"/><text x="40" y="52" font-size="30" fill="#272329" font-weight="600" text-anchor="start">Install Vydrop temporarily in Firefox</text><text x="40" y="86" font-size="18" fill="#655963" font-weight="400" text-anchor="start">Setup illustration · browser layout may vary</text><rect x="40" y="118" width="1120" height="58" rx="10" fill="#FFFFFF" stroke="#DFD7DC"/><text x="64" y="155" font-size="25" fill="#272329" font-weight="400" text-anchor="start">about:debugging#/runtime/this-firefox</text><rect x="40" y="198" width="230" height="290" rx="10" fill="#F1EDF0" stroke="#DFD7DC"/><text x="62" y="240" font-size="22" fill="#272329" font-weight="400" text-anchor="start">Setup</text><rect x="54" y="269" width="202" height="55" rx="10" fill="#F8E3E9" stroke="#DFD7DC"/><circle cx="78" cy="296" r="17" fill="#BA263A"/><text x="78" y="302" font-size="19" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="104" y="303" font-size="21" fill="#272329" font-weight="600" text-anchor="start">This Firefox</text><text x="304" y="237" font-size="27" fill="#272329" font-weight="600" text-anchor="start">Temporary Extensions</text><circle cx="321" cy="291" r="17" fill="#BA263A"/><text x="321" y="297" font-size="19" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><rect x="350" y="264" width="330" height="54" rx="10" fill="#FFFFFF" stroke="#8E7D87"/><text x="370" y="299" font-size="22" fill="#272329" font-weight="600" text-anchor="start">Load Temporary Add-on…</text><rect x="304" y="346" width="832" height="115" rx="10" fill="#FFFFFF" stroke="#DFD7DC"/><svg x="324" y="369" width="46" height="46" viewBox="0 0 64 64"><path fill="#E63D4D" fill-rule="evenodd" d="M4,8.016L21.625,8.016 27.873,18.056 27.873,27.426 21.179,27.426 32,39.474 42.821,27.426 36.127,27.426 36.127,18.056 42.375,8.016 60,8.016 60,11.586 32,55.984 4,11.586Z"/><path fill="none" stroke="#FFFFFF" stroke-width="1.004" stroke-linejoin="miter" stroke-miterlimit="2" d="M27.873,18.056L27.873,27.426 21.179,27.426 32,39.474 42.821,27.426 36.127,27.426 36.127,18.056"/></svg><text x="383" y="393" font-size="25" fill="#272329" font-weight="600" text-anchor="start">Vydrop</text><text x="383" y="429" font-size="20" fill="#655963" font-weight="400" text-anchor="start">Temporary extension · Reload · Remove</text><circle cx="64" cy="526" r="17" fill="#BA263A"/><text x="64" y="532" font-size="19" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text><text x="92" y="533" font-size="23" fill="#272329" font-weight="600" text-anchor="start">Select this file from your extracted app folder:</text><rect x="62" y="553" width="1076" height="57" rx="10" fill="#F8E3E9" stroke="#DFD7DC"/><text x="84" y="590" font-size="24" fill="#272329" font-weight="400" text-anchor="start">Documents / Vydrop / Browser / firefox / manifest.json</text><circle cx="64" cy="657" r="17" fill="#BA263A"/><text x="64" y="663" font-size="19" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text><text x="92" y="664" font-size="22" fill="#272329" font-weight="400" text-anchor="start">Refresh the page, play the video, then use Download by Vydrop.</text><text x="62" y="715" font-size="21" fill="#A12232" font-weight="600" text-anchor="start">Temporary installation ends when Firefox restarts. Load it again next session.</text></g></svg>
