<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Load the Vydrop companion in Chrome or Edge</title>
  <desc id="desc">Open chrome://extensions or edge://extensions. Turn on Developer mode, click Load unpacked, and select Browser/chromium. Setup illustration; browser layout varies.</desc>
  <rect width="1200" height="690" rx="20" fill="#f4f8f7"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect width="1200" height="110" rx="20" fill="#171e22"/><rect y="85" width="1200" height="25" fill="#171e22"/>
    <circle cx="60" cy="55" r="24" fill="#E63D4D"/><text x="60" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">3</text>
    <text x="105" y="51" font-size="31" font-weight="600" fill="#F6F2F4">Load the companion in your browser</text>
    <text x="105" y="82" font-size="18" fill="#D4BEC5">SETUP ILLUSTRATION · controls may be arranged differently</text>
    <rect x="40" y="144" width="545" height="112" rx="12" fill="#fff" stroke="#c5d5d0"/>
    <text x="62" y="181" font-size="19" font-weight="600" fill="#61786f">GOOGLE CHROME</text>
    <text x="62" y="224" font-size="28" font-family="Consolas, monospace" fill="#272329">chrome://extensions</text>
    <rect x="615" y="144" width="545" height="112" rx="12" fill="#fff" stroke="#c5d5d0"/>
    <text x="637" y="181" font-size="19" font-weight="600" fill="#61786f">MICROSOFT EDGE</text>
    <text x="637" y="224" font-size="28" font-family="Consolas, monospace" fill="#272329">edge://extensions</text>
    <g fill="#fff" stroke="#c5d5d0"><rect x="40" y="294" width="350" height="231" rx="12"/><rect x="425" y="294" width="350" height="231" rx="12"/><rect x="810" y="294" width="350" height="231" rx="12"/></g>
    <g fill="#A91F33"><circle cx="76" cy="330" r="17"/><circle cx="461" cy="330" r="17"/><circle cx="846" cy="330" r="17"/></g>
    <g text-anchor="middle" font-size="19" font-weight="700" fill="#fff"><text x="76" y="337">1</text><text x="461" y="337">2</text><text x="846" y="337">3</text></g>
    <text x="61" y="385" font-size="26" font-weight="600" fill="#272329">Developer mode</text>
    <rect x="62" y="413" width="78" height="37" rx="19" fill="#A91F33"/><circle cx="121" cy="432" r="14" fill="#fff"/>
    <text x="158" y="441" font-size="22" fill="#A91F33">ON</text>
    <text x="61" y="493" font-size="19" fill="#62756e">Enable it on the extensions page.</text>
    <rect x="447" y="373" width="305" height="68" rx="10" fill="#F8E3E9" stroke="#A91F33" stroke-width="2"/>
    <text x="600" y="416" text-anchor="middle" font-size="26" font-weight="600" fill="#A91F33">Load unpacked</text>
    <text x="447" y="493" font-size="19" fill="#62756e">Open the folder chooser.</text>
    <text x="832" y="386" font-size="23" font-family="Consolas, monospace" fill="#272329">Browser / chromium</text>
    <rect x="832" y="410" width="305" height="44" rx="8" fill="#A91F33"/>
    <text x="985" y="440" text-anchor="middle" font-size="22" fill="#fff">Select Folder</text>
    <text x="832" y="493" font-size="19" fill="#62756e">Choose the extracted app folder.</text>
    <rect x="40" y="563" width="1120" height="86" rx="12" fill="#F1EDF0"/>
    <text x="64" y="597" font-size="22" font-weight="600" fill="#272329">Then: check Vydrop 1.3.0 is enabled.</text>
    <text x="64" y="630" font-size="20" fill="#445f55">Allow the required website access, refresh the video page, and start playback.</text>
  </g>
</svg>
