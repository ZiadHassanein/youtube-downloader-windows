<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Send a playing video to Vydrop</title><desc id="desc">Playback diagram showing the V-only icon beside Download by Vydrop above the right video border, with review in the desktop app before download.</desc><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#F8F7F8" stroke="#DFD7DC"/><text x="40" y="52" font-size="30" fill="#272329" font-weight="600" text-anchor="start">Send the video you are watching to Vydrop</text><text x="40" y="86" font-size="18" fill="#655963" font-weight="400" text-anchor="start">Playback illustration · the tab stays outside the video picture</text><rect x="40" y="130" width="1120" height="540" rx="10" fill="#FFFFFF" stroke="#DFD7DC"/><rect x="84" y="252" width="1032" height="330" rx="10" fill="#20242A" stroke="#20242A"/><text x="600" y="425" font-size="34" fill="#F6F2F4" font-weight="500" text-anchor="middle">Your playing video</text><rect x="814" y="186" width="302" height="52" rx="10" fill="#F1EDF0" stroke="#8E7D87"/><svg x="825" y="194" width="34" height="34" viewBox="0 0 64 64"><path fill="#E63D4D" fill-rule="evenodd" d="M4,8.016L21.625,8.016 27.873,18.056 27.873,27.426 21.179,27.426 32,39.474 42.821,27.426 36.127,27.426 36.127,18.056 42.375,8.016 60,8.016 60,11.586 32,55.984 4,11.586Z"/><path fill="#FFFFFF" d="M27.873,18.056L27.873,27.426 21.179,27.426 32,39.474 42.821,27.426 36.127,27.426 36.127,18.056Z"/></svg><text x="868" y="219" font-size="20" fill="#272329" font-weight="600" text-anchor="start">Download by Vydrop</text><circle cx="782" cy="212" r="17" fill="#BA263A"/><text x="782" y="218" font-size="19" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><text x="84" y="627" font-size="22" fill="#272329" font-weight="400" text-anchor="start">Click the tab, then review the detected link, format and save folder in the app.</text><text x="62" y="719" font-size="21" fill="#655963" font-weight="400" text-anchor="start">No tab visible? Open the Vydrop toolbar popup. Click Download in the app to start saving.</text></g></svg>
