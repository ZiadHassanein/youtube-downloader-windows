name: Feature request / اقتراح ميزة
description: Explain the task you want to complete.
title: "[Feature] "
body:
  - type: input
    id: version
    attributes:
      label: App and Windows versions / إصدار التطبيق وويندوز
  - type: textarea
    id: task
    attributes:
      label: What task is difficult today? / ما المهمة الصعبة حاليًا؟
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior / السلوك المقترح
    validations:
      required: true
