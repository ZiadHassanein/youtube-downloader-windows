name: Windows preview
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'
      - name: Test core, native processes, recovery and WPF
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Package portable preview and browser companion
        shell: pwsh
        run: |
          $version = '4.0.0-preview.1'
          ./scripts/package.ps1 -Version $version -Preview
          ./scripts/smoke-exe.ps1 -Version $version
          dotnet ./tests/Downloader.Tests/bin/Release/net10.0-windows/Downloader.Tests.dll --native-host "./dist/ViFree-$version-win-x64/ViFree.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged browser host checks failed.' }
          ./scripts/package-browser.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-preview
          path: |
            dist/ViFree-v*-win-x64.zip
            dist/checksums-desktop.json
            dist/ViFree-browser-preview.zip
          if-no-files-found: error
