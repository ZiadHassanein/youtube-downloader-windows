name: Windows build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'
      - name: Test core, native processes, recovery and WPF
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Package and verify portable app
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The release tag must match the source version.'
          }
          ./scripts/package.ps1 -Version $version
          ./scripts/smoke-exe.ps1 -Version $version
          dotnet ./tests/Downloader.Tests/bin/Release/net10.0-windows/Downloader.Tests.dll --package "./dist/Vydrop-v$version-win-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged app checks failed.' }
          dotnet ./tests/Downloader.Tests/bin/Release/net10.0-windows/Downloader.Tests.dll --native-host "./dist/Vydrop-$version-win-x64/Vydrop.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged browser host checks failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-app
          path: |
            dist/Vydrop-v*-win-x64.zip
            dist/checksums-desktop.json
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-app
          path: dist
      - name: Publish verified release in the main repository
        shell: pwsh
        env:
          GH_RELEASE_TOKEN: ${{ github.token }}
        run: ./scripts/release.ps1
